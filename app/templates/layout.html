<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}OpenAI Flask Lab{% endblock %}</title>
  {% for css_url in asset_css_urls('src/main.js') %}
  <link rel="stylesheet" href="{{ css_url }}">
  {% endfor %}
  <script src="{{ asset_url('src/main.js') }}" defer></script>
</head>
<body class="bg-zinc-100 text-zinc-950">
  <nav class="border-b border-zinc-200 bg-white">
    <div class="mx-auto flex max-w-5xl items-center justify-between px-4 py-4">
      <a href="/" class="font-semibold">OpenAI Flask Lab</a>
      <div class="flex items-center gap-4 text-sm">
        <a href="/settings/" class="text-zinc-700 hover:text-zinc-950">Global settings</a>
        <a href="/api/health" class="text-emerald-700 hover:text-emerald-900">/api/health</a>
      </div>
    </div>
  </nav>
  <main class="mx-auto max-w-5xl px-4 py-6">
    {% with messages = get_flashed_messages() %}
      {% if messages %}
        <div class="mb-4 space-y-2">
          {% for message in messages %}
            <div class="border border-amber-200 bg-amber-50 px-4 py-3 text-sm text-amber-950">{{ message }}</div>
          {% endfor %}
        </div>
      {% endif %}
    {% endwith %}
    {% block content %}{% endblock %}
  </main>
</body>
</html>
